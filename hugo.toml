baseURL = 'https://go-teal.github.io/'
languageCode = 'en-us'
title = 'Teal - High-Performance ETL Tool'
theme = 'teal-theme'

[params]
  description = 'Teal is a high-performance, scalable open-source ETL tool built on Go, designed to streamline data transformation and orchestration.'
  author = 'Boris Ershov'
  github = 'https://github.com/go-teal/teal'

